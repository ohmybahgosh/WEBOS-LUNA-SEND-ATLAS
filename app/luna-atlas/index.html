<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Luna Atlas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <img src="icon160.png" alt="">
    <h1>Luna&nbsp;Atlas</h1>
    <input id="search" type="text" placeholder="Search methods, e.g. toast, setSystemSettings, tvpower">
    <span id="stats" class="stats"></span>
  </header>
  <div id="cats" class="cats"></div>
  <main>
    <nav id="svclist" class="pane" tabindex="0"></nav>
    <section id="methodlist" class="pane" tabindex="0"></section>
    <section id="detail" class="pane detail"></section>
  </main>
  <footer>
    <span><span class="k">OK</span>Select</span>
    <span><span class="k">&#9650; &#9660;</span>Move</span>
    <span><span class="k">BACK</span>Back</span>
    <span id="hint">Red = can change or damage the TV.</span>
    <span class="right">github.com/ohmybahgosh/WEBOS-LUNA-SEND-ATLAS</span>
  </footer>
</div>
<script src="vendor/qrcode.js"></script>
<script src="js/luna.js"></script>
<script src="js/app.js"></script>
</body>
</html>
